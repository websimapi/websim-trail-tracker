<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="map"></div>
    
    <div class="controls">
        <button id="newTrailBtn" class="btn btn-primary">
            <span class="icon">+</span>
            New Trail
        </button>
        <button id="stopTrailBtn" class="btn btn-secondary" style="display: none;">
            <span class="icon">■</span>
            Stop Recording
        </button>
        <button id="cameraBtn" class="btn btn-camera" style="display: none;">
            <span class="icon">📷</span>
        </button>
        <button id="deleteTrailBtn" class="btn btn-danger" style="display: none;">
            <span class="icon">🗑</span>
            Delete Trail
        </button>
    </div>

    <div class="trail-list" id="trailList">
        <h3>Saved Trails</h3>
        <div id="trails"></div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    
    <div id="imageModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img id="modalImage" src="" alt="Trail Photo">
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="main.js"></script>

</body>
</html>
